[project]
name = "cpdp-in-go"
version = "2.0.0"
description = "Strict LOPO baselines and reproducibility analyses for cross-project defect prediction in Go"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imbalanced-learn==0.13.0",
  "matplotlib==3.10.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "tqdm==4.67.1",
  "xgboost==3.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
